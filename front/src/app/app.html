<mat-toolbar color="primary">
  <a routerLink="/catalogue" class="marque">Flapazon</a>
  <span class="espace"></span>
  <a mat-button routerLink="/catalogue">Catalogue</a>
  @if (authService.estConnecte())
  {
    @if (estVendeur())
    {
      <a mat-button routerLink="/vendeur">Mon magasin</a>
    }
    <a mat-button routerLink="/mes-commandes">Mes commandes</a>
    <a mat-icon-button routerLink="/panier" [matBadge]="panierService.nombre()" [matBadgeHidden]="panierService.nombre() === 0" matBadgeColor="accent">
      <mat-icon>shopping_cart</mat-icon>
    </a>
    <button mat-button (click)="deconnexion()">Déconnexion</button>
  }
  @else
  {
    <a mat-button routerLink="/connexion">Connexion</a>
    <a mat-button routerLink="/inscription">Inscription</a>
  }
</mat-toolbar>

<main class="contenu">
  <router-outlet></router-outlet>
</main>
