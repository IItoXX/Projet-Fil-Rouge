<mat-toolbar class="barre">
  <a routerLink="/catalogue" class="marque">Flapazon<span class="point">.</span></a>
  <nav class="liens">
    <a routerLink="/catalogue" routerLinkActive="actif">Catalogue</a>
    @if (authService.estConnecte())
    {
      @if (estVendeur())
      {
        <a routerLink="/vendeur" routerLinkActive="actif">Mon magasin</a>
      }
      <a routerLink="/mes-commandes" routerLinkActive="actif">Mes commandes</a>
    }
  </nav>
  <span class="espace"></span>
  @if (authService.estConnecte())
  {
    <a mat-icon-button routerLink="/panier" [matBadge]="panierService.nombre()" [matBadgeHidden]="panierService.nombre() === 0">
      <mat-icon>shopping_cart</mat-icon>
    </a>
    <span class="bonjour">{{ authService.utilisateur()?.nom }}</span>
    <button mat-stroked-button class="bouton-sortie" (click)="deconnexion()">Déconnexion</button>
  }
  @else
  {
    <a mat-button routerLink="/connexion">Connexion</a>
    <a mat-flat-button class="bouton-inscription" routerLink="/inscription">Créer un compte</a>
  }
</mat-toolbar>

<main class="contenu">
  <router-outlet></router-outlet>
</main>
