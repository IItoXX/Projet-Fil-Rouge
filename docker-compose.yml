services:
  postgres:
    image: postgres:16-alpine
    container_name: flapazon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - flapazon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: flapazon-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - flapazon-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./backend/auth-service
    container_name: flapazon-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: flapazon_auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    ports:
      - "${AUTH_PORT}:3001"
    networks:
      - flapazon-net

  products-service:
    build: ./backend/products-service
    container_name: flapazon-products
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PRODUCTS_PORT: 3002
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/flapazon_produits?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${PRODUCTS_PORT}:3002"
    networks:
      - flapazon-net

  stocks-service:
    build: ./backend/stocks-service
    container_name: flapazon-stocks
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STOCKS_PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: flapazon_stocks
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    ports:
      - "${STOCKS_PORT}:3003"
    networks:
      - flapazon-net

  orders-service:
    build: ./backend/orders-service
    container_name: flapazon-orders
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORDERS_PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: flapazon_orders
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      PRODUCTS_URL: http://products-service:3002
      STOCKS_URL: http://stocks-service:3003
    ports:
      - "${ORDERS_PORT}:3004"
    networks:
      - flapazon-net

volumes:
  postgres-data:
  mongo-data:

networks:
  flapazon-net:
    driver: bridge